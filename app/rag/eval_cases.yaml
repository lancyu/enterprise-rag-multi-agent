# RAG L5 离线检索评测用例（可自行增删，无需改代码）
#
# 字段：
#   question         用户问题
#   expect_keywords  命中判定的关键词（Top-K 任一片段包含任一即算命中）
#   expect_source    可选，限定命中片段的来源文件名
#   expect_section   可选，期望答案所在的章节锚点（如「第三章 假期管理」「1.3 密码重置」）。
#                    用于「章节命中率」——结构感知切分（T2-2）上线后才有意义；
#                    子串匹配 heading_path / chapter / section 任一字段，写关键词即可。
#
# 规模说明（2026-09-08 扩充：4 条 → 25 条）
#   原先只有 4 条，A/B 对比时 hit_rate 与 MRR **两组都是 1.000**（天花板效应），
#   完全无法区分策略优劣，A/B 结论只能靠 section_hit_rate 单指标支撑，说服力不足。
#   现覆盖 11 篇文档的 25 个场景（含跨文档同名概念，如「分级」在数据分级/客户分级/
#   伙伴分级里都有），让 hit_rate / MRR 重新具备区分度。
#
# 覆盖：员工手册(5) 财务报销(2) IT支持(3) 产品FAQ(3) 信息安全(2)
#       客户成功(1) 招聘(2) 行政(1) 销售(2) API指南(2) 系统速查(1) PDF白皮书(1)
