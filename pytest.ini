[pytest]
# 让 `pytest` 一键可跑：
#   - pythonpath：自动把仓库根目录与 scripts/ 加进 sys.path，
#     免去每次手写 `PYTHONPATH=.:scripts`（test_chunking_baseline 依赖 scripts/chunk_metrics）
#   - testpaths：默认只扫 tests/
#   - basetemp：固定 pytest 临时目录。
#     某些沙箱把已有目录的 mkdir 报成 PermissionError 而非 FileExistsError，
#     会绕过 pytest 自身的容错，导致用到 tmp_path 的用例批量 ERROR（与代码无关）。
#     固定到项目内可彻底规避；pytest 每次会自动清理并只保留最近几次运行。
pythonpath = . scripts
testpaths = tests
python_files = test_*.py
addopts = -ra --basetemp=.pytest_tmp
