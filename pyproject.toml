# ============================================================
# 工具配置（仅静态检查，不含打包元数据——本项目是应用而非可发布库）
#
# 死代码治理分三层，对应下面三个 [tool.*] 段：
#   1. ruff    —— 未使用 import / 局部变量 / 未定义名（零误报，作为 CI 硬门禁）
#   2. vulture —— 未使用函数 / 类 / 变量（对框架约定易误报，靠 ignore_decorators 收敛）
#   3. deptry  —— 未使用 / 缺失 / 传递依赖（运行时依赖靠 per_rule_ignores 显式豁免）
#
# 项目自建的 AST 扫描器见 scripts/deadcode_scan.py，执行契约见 tests/test_deadcode.py。
# 三层互补的原因：ruff/vulture 看不到 getattr(config, "X") 这类动态消费，
# 也认不出字符串形式的引用（FastAPI 装饰器、LangGraph 节点名）。
# ============================================================

# ------------------------------------------------------------
# ruff：启用与「未使用 / 死代码 / 僵尸抑制」直接相关的规则
#
# 为什么不学 langchain 开 `select = ["ALL"]`：本项目仍有大量与死代码无关的
# 历史风格问题（E501 长行、PLR 复杂度、S 安全类等数百处），一次全开会让门禁
# 长期红着，反而失去约束力。规则按「零误报 + 与本次治理目标同源」两个标准增量开启。
#
# 四个规则集各自的理由：
#   F      —— 未使用 import / 局部变量 / 重定义（死代码主战场）
#   E4     —— import 位置（E401/E402）。迟到的 import 会制造「函数定义前先被
#             引用」的假象，也让依赖关系看不出来；本项目已在 retriever.py 真踩到一次
#             （`import fnmatch` 写在模块中部）
#   BLE    —— 裸 `except Exception`。不是要求消灭它（降级路径**就该**吞异常），
#             而是要求每一处都**显式写出来并说明为什么**，避免"顺手 catch 一切"
#             掩盖真实故障
#   RUF100 —— 僵尸 noqa。这条是本次治理的元规则：抑制注释一旦过期就不再被校验，
#             会让人误以为"这里已经确认过"。它与 tests/deadcode_allowlist.py 的
#             僵尸豁免校验、deptry 的 per_rule_ignores 清理是同一件事的三个面
#
# ⚠️ 顺序有讲究：**必须先开 BLE，再清理 RUF100**。RUF100 的报错分两类，含义完全不同
# （实测验证过，不是推测）：
#   - `non-enabled: X` —— 规则 X 根本没开，这个 noqa 现在无用；**但规则一开就可能变必需**。
#     先清后开 = 把必需的抑制注释删掉，规则一开立刻全红。
#   - `unused: X` —— 规则 X 开着、但此处确实不违规，这个 noqa 是**真僵尸**，可以放心删。
# 本项目的 12 处清理全部属于第二类，其中 3 处特别值得一提：它们抑制的是 BLE001，
# 而 ruff 的 BLE001 **不报"捕获后又重新抛出/转换抛出"的处理器**——所以那 3 处
# （providers/llm.py 重试与流式回退、rag/evaluator.py 转换异常类型）从一开始就不需要
# noqa，属于历史遗留的死注释。判据不是"有没有 except Exception"，而是"异常有没有被
# 吞掉"——被吞掉才需要显式说明理由。
# ------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    ".venv",
    "artifacts",      # 历史上遗留的源码备份副本，不参与任何检查
    "vector_store",
    "memory_store",
    "logs",
    "data",
    ".pytest_tmp",
]

[tool.ruff.lint]
select = ["F", "E4", "BLE", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# 包的 __init__.py 承担「re-export 对外 API」职责，导入即是使用。
# 这是 FastAPI / langchain 等项目的通行做法（见 fastapi 官方 pyproject.toml）。
"__init__.py" = ["F401"]

# ------------------------------------------------------------
# vulture：未使用函数 / 类 / 变量
#
# min_confidence = 80：vulture 的置信度按代码类型固定（import 90%、函数/类/变量 60%）。
#   80 能挡掉绝大多数「名字统计型误报」，同时保留高确定性的发现。
# ignore_decorators：被这些装饰器注册的函数由框架隐式调用，没有显式调用点。
#   这是 vulture 官方文档推荐的 FastAPI / pytest 处理方式。
# 日常排查（含 60% 档）请用项目自建扫描器：
#   python scripts/deadcode_scan.py .
# 若将来需要抑制个别条目，用官方机制：
#   vulture app scripts --make-whitelist > .vulture_whitelist.py
# 并把该文件一并作为扫描路径传入。
# ------------------------------------------------------------
[tool.vulture]
min_confidence = 80
paths = ["app", "scripts"]
ignore_decorators = [
    "@app.get", "@app.post", "@app.put", "@app.delete", "@app.patch",
    "@app.middleware", "@app.exception_handler", "@app.on_event",
    "@router.get", "@router.post", "@router.put", "@router.delete", "@router.patch",
    "@pytest.fixture",
    "@field_validator", "@model_validator",
]
exclude = ["artifacts", ".venv", "tests"]

# ------------------------------------------------------------
# deptry：依赖健康度
#
# known_first_party：项目内部模块。scripts/ 未做成包，故把其中被 import 的
#   chunk_metrics 也显式登记为一方模块。
#
# per_rule_ignores 的每条都写明理由——这是 deptry 官方文档与真实项目
#   （如 contextgem）的既有做法：豁免必须是一次有意识的决策。
# ------------------------------------------------------------
[tool.deptry]
requirements_files = ["requirements.txt"]
requirements_files_dev = ["requirements-dev.txt"]
known_first_party = ["app", "scripts", "chunk_metrics"]
extend_exclude = [
    "artifacts",      # 源码备份副本，不代表当前依赖关系
    ".venv", "vector_store", "memory_store", "logs", "data", ".pytest_tmp",
]

[tool.deptry.per_rule_ignores]
# DEP001：import 了但未声明为依赖 —— 全部是「可选依赖」，由 try/except 或
# 代码内 import 做存在性探测，缺失时自动降级，故不写入 requirements.txt。
DEP001 = [
    "torch",                # 可选：本地 BERT 路由分类器（app/core/model_router.py）
    "transformers",         # 可选：同上
    "chromadb",             # 可选：生产级向量库，VECTOR_DB_TYPE=chroma 时启用
    "sentence_transformers", # 可选：cross-encoder 精排（app/providers/rerank.py）
    "pytesseract",          # 可选：扫描版 PDF 的 OCR 兜底（app/utils/doc_loader.py）
]
# DEP002：声明了但代码里没 import —— 属于「运行期由命令行/框架隐式使用」。
# 这是 deptry 自身文档 JSON 输出中就会出现的经典误报类型，无原生标记机制，
# 只能显式豁免。
DEP002 = [
    "uvicorn",              # ASGI 服务器：`uvicorn app.main:app` 启动，业务代码不 import
    "python-multipart",     # FastAPI 解析 multipart/form-data（文件上传）的运行时依赖，无 import 点
]
# DEP003：直接使用别人的传递依赖。**本项已清空，且刻意保留空列表**——
# 记录一次决策，避免以后又退回去用豁免代替声明。
#
# 原先豁免 4 项（yaml / PIL / starlette / langsmith），现已全部处置完：
#   - yaml、PIL、starlette → 升格为 requirements.txt 的直接依赖。
#     判据是「直接用就该直接声明」+「失效代价」：starlette 缺失会在**启动时**
#     炸；Pillow 缺失会被 doc_loader 的 except 吞掉，表现为「扫描版 PDF 静默变空」，
#     是最难排查的一类故障。让问题在安装期暴露远好于在运行期。
#   - langsmith → 全仓已无直接 import（追踪能力由 LangChain 通过环境变量接管，
#     见 app/core/observability.py）。这条豁免是**僵尸条目**，故删除。
#
# 以后再出现 DEP003，先问：这个包是不是该写进 requirements.txt？
DEP003 = []
# DEP004：生产代码 import 了开发依赖。**本项同样已清空**：pytest 只出现在
# tests/ 下，deptry 认得 requirements-dev.txt 里的 dev 依赖，从未真的报过
# DEP004 —— 原先那条 `["pytest"]` 是**僵尸豁免**（从未生效的豁免比不写更糟：
# 它让人以为「这条已确认过」，实际什么都没确认）。
#
# 本节（per_rule_ignores）现在的健康度是可以机器验证的：
# 把任意一条清空后重跑 deptry，若不再报该项，说明该条是僵尸。
# 本次就是这么查出 DEP003 的 4 条与 DEP004 的 1 条已失效。
DEP004 = []

# ------------------------------------------------------------
# import-linter：把分层写成**可执行的契约**（P1-2）
#
# 为什么需要它：`api → core → … → utils` 这条线在文档里写了很久，
# 但**没有任何机制拦得住**。加一处 `from app.api import x` 到 `app/rag/` 里，
# 代码照跑、测试照绿，只有下一个读代码的人才会发现分层已经名存实亡。
#
# 契约方向：**下层不得 import 上层**（列表自上而下）。同一层内互相 import 允许。
#
# 层的划分依据是**运行时职责**，不是目录名：
#   app.api                          —— HTTP 接口层（FastAPI 路由）
#   app.graph                        —— 编排层（LangGraph 工作流）
#   app.core                         —— 服务层（五个 Agent、路由漏斗、启动自检）
#   app.rag | app.memory | app.tools —— 能力层（检索 / 记忆 / 业务工具）
#   app.db | app.providers           —— 适配层（向量库与 Redis、LLM 与 Embedding 厂商）
#   app.utils                        —— 基础层（日志、缓存、文本、文档加载）
#
# ⚠️ 关于 ignore_imports 里那 15 条：它们是**已知且接受**的依赖方向，
# 不是待修的缺陷。分成三类，每条都写明理由 —— 这是 deptry per_rule_ignores
# 与 tests/deadcode_allowlist.py 的同一套做法：豁免必须是一次有意识的决策。
#
# unmatched_ignore_imports_alerting = error：**清单只减不增**。
# 被豁免的那行 import 一旦被删/挪走，条目立刻变成"僵尸豁免"并把门禁打红 ——
# 避免这份清单像所有无人维护的豁免清单一样，慢慢变成一串没人敢动的噪音。
#
# 新增一条向上依赖时会红。这是**刻意的**：那一刻正是需要有人判断
# 「是真的需要，还是分层放错了位置」的时候。
# ------------------------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "分层：下层不得 import 上层"
type = "layers"
layers = [
    "app.api",
    "app.graph",
    "app.core",
    "app.rag : app.memory : app.tools",
    "app.db | app.providers",
    "app.utils",
]
ignore_imports = [
    # ---- A 类（10 条）：能力层使用 app.core 里的**基础设施子模块** ----
    # app.core 目前同时装着两类东西：编排（router_agent / sub_agents / tool_agent /
    # routing / self_check）与**基础设施**（prompts / llm_factory / tracing /
    # errors / request_ctx / observability）。下面这些边指向的**全是后者**，
    # 方向本身是预期的：能力层当然要用 prompt 模板和模型工厂。
    # 之所以在契约里仍算"向上"，只是因为它们和编排代码住在同一个包里。
    # 把这些基础设施拆成独立的 app/infra/ 能消掉这批豁免，但会让 30+ 处 import
    # 改路径、并对运行时行为零影响 —— 收益是"契约看起来更干净"，
    # 代价是一次大面积重命名。故显式登记为已知且接受。
    "app.memory.consolidator -> app.core.prompts",
    "app.memory.consolidator -> app.core.llm_factory",
    "app.memory.dream -> app.core.prompts",
    "app.memory.dream -> app.core.llm_factory",
    "app.rag.generator -> app.core.prompts",
    "app.rag.generator -> app.core.llm_factory",
    "app.rag.retriever -> app.core.prompts",
    "app.rag.retriever -> app.core.llm_factory",
    "app.rag.retriever -> app.core.request_ctx",
    "app.providers.llm -> app.core.observability",
    # app.rag.evaluator 用 AppError 把内部失败转成可外发的故障类型 ——
    # 异常基类就该是全局共享的最低层设施，方向没有争议。
    "app.rag.evaluator -> app.core.errors",

    # ---- B 类（2 条）：启动自检要跑一遍真实的图 ----
    # self_check 是"启动时把整条链路真的跑一遍"的能力，按职责它属于编排层，
    # 只是住在 app/core/ 里。它的自检项必须 invoke 真实工作流，否则就退化成
    # "只检查配置项存在"——那正是它当初要取代的东西。
    "app.core.self_check -> app.graph.workflow_graph",
    "app.core.self_check -> app.graph.state",

    # ---- C 类（2 条）：基础层向上依赖，**这两条是真债务，不是接受** ----
    # ① logger 需要 get_trace_id 才能给每行日志加 [trace=xxx] 前缀。
    #    更干净的做法是把 trace_id 的存放处下沉到 utils（或独立的
    #    app/runtime_flags 式零依赖模块），logger 只读那个 —— 与 P1-6
    #    解 config 反向依赖是同一件事的另一半。
    "app.utils.logger -> app.core.tracing",
    # ② embedding 需要读 providers.embeddings 判断当前是"真实神经向量"还是
    #    "本地哈希"，而 config 又要读 embedding → 形成
    #    config → utils.embedding → providers.embeddings → config 的环。
    #    这一条由 P1-6 处理（把"当前 embedding 模式"变成启动时注入的普通值）。
    "app.utils.embedding -> app.providers.embeddings",
]
unmatched_ignore_imports_alerting = "error"
