# ============================================================
# 一键编排：应用 + Redis 缓存（+ 可选 Milvus Standalone）
#
#   默认（memory / chroma 向量库）：
#       docker compose up -d                 # 只起 app + redis
#   启用 Milvus 向量库：
#       VECTOR_DB_TYPE=milvus docker compose --profile milvus up -d
#
# 日志：docker compose logs -f app
# 停止：docker compose down                 # 加 -v 连数据卷一起删
#
# 为什么用 profile 而不是直接编进默认编排：Milvus Standalone 是**三个**容器
# （milvus + etcd + minio），且首次启动要 60~90s 才健康。把它做成默认依赖会让
# 「只想用内存库」的人每次启动都白等，所以设为按需开启。
# ============================================================
services:
  app:
    build:
      context: .
      # 用 chroma / milvus 时须传 1，否则容器内缺客户端包会降级为内存库
      args:
        WITH_VECTOR_CLIENTS: ${WITH_VECTOR_CLIENTS:-0}
    container_name: enterprise-bot
    ports:
      - "8001:8001"
    environment:
      # 大模型配置（OpenAI 兼容协议）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      # 向量库：memory（零依赖）/ chroma（需 WITH_VECTOR_CLIENTS=1）/ milvus（需 --profile milvus 且 WITH_VECTOR_CLIENTS=1）
      VECTOR_DB_TYPE: ${VECTOR_DB_TYPE:-memory}
      # 严格模式：true 时「配了 milvus 却连不上」直接拒绝启动，而不是静默降级为内存库
      VECTOR_DB_STRICT: ${VECTOR_DB_STRICT:-false}
      # Milvus 连接（VECTOR_DB_TYPE=milvus 时生效；容器内用服务名 milvus 访问）
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      # 集合名，留空则复用 COLLECTION_NAME
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-}
      # Redis 缓存（容器内通过服务名访问）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 业务结构化数据（SQLite，只读）。默认值 ./data/enterprise.db 已在挂载卷内，
      # 首次部署需先播种：docker exec enterprise-bot python scripts/seed_enterprise_db.py
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-./data/enterprise.db}
      # 注：服务端**没有登录态**。历史上曾有 EMPLOYEE_IDENTITY_MAP（会话身份 →
      # 工号映射）供工单查询做权限校验，随工单工具一起整条移除。若要按人鉴权，
      # 正确做法是接真实 SSO，而不是把映射表塞回环境变量。
    volumes:
      - ./data:/app/data                        # 企业知识库文档
      - ./vector_store:/app/vector_store        # 向量索引持久化
      - ./memory_store:/app/memory_store        # 长期记忆（USER.md 画像 + history.jsonl 对话原文），不挂则容器重启即丢失
      - ./logs:/app/logs                        # 运行日志
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bot-net

  redis:
    image: redis:7-alpine
    container_name: enterprise-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bot-net

  # ============================================================
  # Milvus Standalone（可选，docker compose --profile milvus up -d）
  #
  # Milvus 自身只负责向量检索，元数据与对象存储是**外部依赖**：
  #   milvus → etcd（元数据/协调） + minio（segment 与索引文件）
  # 因此「起一个 Milvus 容器」是不够的，必须三件一起起。
  # ============================================================
  etcd:
    profiles: ["milvus"]
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - bot-net

  minio:
    profiles: ["milvus"]
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # 控制台，可浏览 Milvus 的 segment 文件
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - bot-net

  milvus:
    profiles: ["milvus"]
    image: milvusdb/milvus:v2.4.15
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC，应用连这个
      - "9091:9091"     # 健康检查 / 指标
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s   # 首次启动要等 etcd/minio 就绪 + 自身初始化
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bot-net

volumes:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:

networks:
  bot-net:
    driver: bridge
